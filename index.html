<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Conquer: a roll-and-move kingdom board game on an 11 by 11 grassland.">
<title>Conquer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Libre+Franklin:wght@400;500;600;700&display=swap">
<style>
@import url("https://fonts.googleapis.com/css2?family=Anton&family=Libre+Franklin:wght@400;600;700&display=swap");
/* Layout: the game table. The board sits on the left in the deck's yellow frame, controls stack in a right rail; one column on phones. Single dark look taken from the slate deck. */
:root{
  color-scheme:dark;
  --table:#161B23;
  --panel:#1F2631;
  --panel-2:#28303D;
  --line:#3A4452;
  --ink:#F2EFE7;
  --ink-2:#C2C6CC;
  --ink-3:#9AA1AB;
  --frame:#F2C230;
  --frame-hi:#FFD54F;
  --on-frame:#1A1606;
  --danger:#F0675C;
  --bone:#E8E2D0;
  --grid:#0C0F13;
  --scrim:rgba(6,8,11,.76);
  --radius:4px;
  --font-display:"Anton","Impact","Arial Narrow Bold",sans-serif;
  --font-ui:"Libre Franklin","Franklin Gothic Medium","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--table);color:var(--ink)}
body{font-family:var(--font-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
h1,h2,h3,p,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
img{max-width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{max-width:1280px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.disp{font-family:var(--font-display);font-weight:400;letter-spacing:.01em;line-height:1;text-wrap:balance}
h2{font-size:17px;font-weight:700;line-height:1.25;text-wrap:balance}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.n{text-align:right;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--frame);outline-offset:2px}

/* buttons */
.btn{min-height:44px;padding:10px 18px;border-radius:var(--radius);border:1px solid var(--ink-3);background:transparent;color:var(--ink);font-weight:600;cursor:pointer;line-height:1.2;transition:background-color .12s,border-color .12s,transform .08s}
.btn:hover{border-color:var(--ink);background:var(--panel-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--frame);border-color:var(--frame);color:var(--on-frame)}
.btn.primary:hover{background:var(--frame-hi);border-color:var(--frame-hi)}
.btn.primary:focus-visible{outline-color:var(--ink)}
.btn.quiet{border-color:transparent;padding-inline:8px;text-decoration:underline;text-underline-offset:3px}
.btn.quiet:hover{background:transparent;color:var(--frame)}
.btn:disabled,.btn:disabled:hover{opacity:.45;cursor:not-allowed;transform:none;background:transparent;border-color:var(--ink-3)}
.btn.primary:disabled{background:var(--frame);border-color:var(--frame)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.actions .btn{flex:1 1 auto}
.note{margin-top:8px;color:var(--ink-2)}

/* top bar */
.top{display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;margin-bottom:16px}
.top .wm{font-family:var(--font-display);font-size:30px;line-height:1;letter-spacing:.02em;color:var(--frame);margin-right:auto}
.top .meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;color:var(--ink-2);font-size:14px;font-variant-numeric:tabular-nums}
.top .meta strong{color:var(--ink)}
.top .tools{display:flex;gap:4px}
.top .tools .btn{min-height:40px;padding:8px 12px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:3px 10px 3px 3px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);cursor:pointer;font-size:13px;font-weight:600;color:var(--ink)}
.chip:hover{border-color:var(--frame)}
.chip img{width:50px;height:32px;object-fit:cover;border-radius:2px}

/* play layout */
.play{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);gap:24px;align-items:start}
.boardcol{min-width:0;width:100%;max-width:max(440px,calc(100vh - 120px));max-width:max(440px,calc(100svh - 120px));justify-self:center}
.rail{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:760px){
  .play{grid-template-columns:minmax(0,1fr);gap:16px}
  .boardcol{max-width:none}
}

/* board */
.board{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));grid-template-rows:repeat(11,minmax(0,1fr));gap:1px;background:var(--grid);border:4px solid var(--frame);aspect-ratio:1/1;width:100%;max-width:100%;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.cell{position:relative;display:block;min-width:0;min-height:0;margin:0;padding:0;border:0;border-radius:0;color:inherit;background-color:#56650F;background-image:linear-gradient(var(--wash,transparent),var(--wash,transparent)),var(--grass);background-size:100% 100%,cover}
.cell.own{--wash:color-mix(in srgb,var(--k) 52%,transparent)}
button.cell{cursor:pointer}
button.cell:hover{filter:brightness(1.14)}
button.cell:active{filter:brightness(.92)}
.cell::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3}
.cell.legal::after{box-shadow:inset 0 0 0 3px var(--frame)}
.cell.legal.enemy::after{box-shadow:inset 0 0 0 3px var(--danger)}
.cell.target::after{box-shadow:inset 0 0 0 4px var(--danger)}
.cell:focus-visible{outline:3px solid var(--ink);outline-offset:-3px;z-index:4}
.cell .asset{position:absolute;left:11%;top:11%;width:78%;height:78%;object-fit:contain;z-index:1;pointer-events:none}
.cell .asset.la{background:var(--bone);border-radius:var(--radius);padding:6%}
.cell .asset.fort{box-shadow:0 0 0 2px var(--k)}
.cell .asset.crops{object-fit:cover;border-radius:var(--radius)}
.pawn{position:absolute;right:5%;top:5%;width:34%;aspect-ratio:1/1;border-radius:50%;background:var(--pk);border:2px solid var(--grid);z-index:2;pointer-events:none}
.pawn.cur{width:44%;right:2%;top:2%;box-shadow:0 0 0 2px var(--frame)}
.vmark{position:absolute;left:9%;bottom:9%;width:17%;aspect-ratio:1/1;background:var(--frame);border:1px solid var(--grid);transform:rotate(45deg);z-index:2;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend img,.legend .pdot{width:22px;height:22px;object-fit:contain}
.legend .ring{display:inline-block;width:18px;height:18px;box-shadow:inset 0 0 0 3px var(--frame)}
.legend .ring.red{box-shadow:inset 0 0 0 3px var(--danger)}
img.la{background:var(--bone);border-radius:var(--radius);padding:2px}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.turn{border:2px solid var(--frame)}
.turn-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 10px;font-size:13px;color:var(--ink-3);margin-bottom:10px}
.turn h2.disp{font-size:30px}
.who{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink);min-width:0}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;background:var(--k);box-shadow:0 0 0 1px var(--grid);flex:none}
.rolled{display:flex;align-items:center;gap:12px}
.die{width:30px;height:30px;flex:none;display:block}
.die.big{width:46px;height:46px}
.die .df{fill:var(--bone);stroke:var(--grid);stroke-width:4}
.die.re .df{stroke:var(--frame);stroke-width:8;stroke-dasharray:12 8}
.die .dp{fill:var(--grid)}
.dice{display:flex;flex-wrap:wrap;gap:6px}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;margin-top:12px;padding:12px;background:var(--panel-2);border-radius:var(--radius)}
.vs > div:last-child{text-align:right}
.vs .num{font-family:var(--font-display);font-size:36px;line-height:1;display:block}
.vs .lab{font-size:13px;color:var(--ink-3)}
.vs .mid{font-size:13px;color:var(--ink-3)}
.odds{margin-top:12px;font-weight:700}

.opts{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.opt{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;min-height:52px;padding:6px 10px 6px 6px;text-align:left;background:var(--panel-2);border:1px solid transparent;border-radius:var(--radius);cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--frame)}
.opt:active{transform:translateY(1px)}
.opt:disabled,.opt:disabled:hover{opacity:.5;cursor:not-allowed;border-color:transparent;transform:none}
.opt .th{width:40px;height:40px;object-fit:contain}
.opt .th.crops{object-fit:cover;border-radius:var(--radius)}
.opt .nm{display:block;font-weight:700}
.opt small{display:block;font-size:13px;color:var(--ink-3)}
.cost{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-variant-numeric:tabular-nums}
.cost img{width:20px;height:20px}

.ktable{width:100%;border-collapse:collapse;font-size:14px}
.ktable th,.ktable td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
.ktable thead th{font-size:12px;font-weight:600;color:var(--ink-3);border-bottom-color:var(--ink-3)}
.ktable tbody tr:last-child > *{border-bottom:0}
.ktable tbody th{font-weight:600}
.ktable tr.cur{background:var(--panel-2)}
.ktable .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ktable .tot{font-weight:700;color:var(--ink)}
.bar{display:block;width:100%;min-width:40px;height:3px;margin-top:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--k)}
.bot{margin-left:6px;font-size:12px;font-weight:400;color:var(--ink-3)}
.tablewrap{overflow-x:auto}

.log{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:13px;color:var(--ink-3)}
.log li:last-child{color:var(--ink)}

/* title */
.title{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:28px 40px;align-items:start;padding-top:16px}
.hero{grid-column:1/-1;display:flex;align-items:center;flex-wrap:wrap;gap:16px 24px}
.hero > div{min-width:0}
.mark{width:clamp(96px,16vw,150px);aspect-ratio:1/1;background:var(--bone);border:4px solid var(--frame);padding:8px;flex:none}
.mark img{width:100%;height:100%;object-fit:contain}
.wordmark{font-family:var(--font-display);font-weight:400;font-size:clamp(64px,13vw,136px);line-height:.88;color:var(--frame);letter-spacing:.01em}
.lede{font-size:18px;color:var(--ink-2);max-width:36ch;margin-top:12px}
.formcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.seat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 8px;align-items:end;margin-top:12px}
.seat label{grid-column:1/-1;font-size:13px;color:var(--ink-3)}
.seat input{min-height:44px;width:100%;padding:8px 10px;background:var(--table);border:1px solid var(--ink-3);border-radius:var(--radius)}
.seat input:hover{border-color:var(--ink-2)}
.seg{display:inline-flex;border:1px solid var(--ink-3);border-radius:var(--radius);overflow:hidden}
.seg button{min-height:42px;padding:8px 12px;border:0;background:transparent;color:var(--ink-2);font-weight:600;cursor:pointer}
.seg button + button{border-left:1px solid var(--ink-3)}
.seg button:hover{background:var(--panel-2);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--table)}
.seg button:focus-visible{outline-offset:-3px}
.field{margin-top:20px}
.field .lab{display:block;font-size:13px;color:var(--ink-3);margin-bottom:6px}
.seatbtns{display:flex;gap:8px;margin-top:12px}
.seatbtns .btn{min-height:40px;padding:8px 12px}
.pieces h2{margin-bottom:12px}
.pieces ul{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px 12px}
.piece{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:center}
.piece > img{width:52px;height:52px;object-fit:contain}
.piece > img.crops{object-fit:cover;border-radius:var(--radius)}
.piece b{display:block}
.piece .eff{display:block;font-size:13px;color:var(--ink-3)}
.piece .cost{margin-top:2px;font-size:14px;color:var(--ink)}
@media (max-width:760px){.title{grid-template-columns:minmax(0,1fr)}}

/* roll-off + setup */
.order{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.order li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;background:var(--panel-2);border-radius:var(--radius)}
.order .rank{font-family:var(--font-display);font-size:24px;line-height:1;color:var(--frame)}
.order .rr{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:12px}
.swatch{display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:8px;min-height:44px;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;font-weight:600;color:var(--ink)}
.swatch i{display:block;height:30px;background:var(--k);border-radius:2px}
.swatch:hover{border-color:var(--frame)}
.swatch:disabled{opacity:.4;cursor:not-allowed;border-color:var(--line)}
.swatch small{font-weight:400;color:var(--ink-3)}

/* modal */
.scrim{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--scrim);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{width:100%;max-width:540px;max-height:100%;overflow:auto;background:var(--panel);border:2px solid var(--frame);border-radius:var(--radius);padding:20px}
.dialog.wide{max-width:720px}
.dialog:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.dialog h2.disp{font-size:36px}
.dialog h3{font-size:15px;font-weight:700;margin:20px 0 8px}
.dialog .sub{margin-top:6px;color:var(--ink-2)}
.lines{display:flex;flex-direction:column;gap:6px}
.lines li{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px 12px}
.lines .val{font-weight:700;font-variant-numeric:tabular-nums}
.sides{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.side{padding:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);min-width:0}
.side.won{border-color:var(--frame)}
.side-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px;font-size:13px;color:var(--ink-3)}
.sum{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:10px;font-size:13px;color:var(--ink-2)}
.sum b{font-family:var(--font-display);font-weight:400;font-size:32px;line-height:1;color:var(--ink)}
.side.won .sum b{color:var(--frame)}
@media (max-width:520px){.sides{grid-template-columns:minmax(0,1fr)}}
.ccard{display:grid;grid-template-columns:132px minmax(0,1fr);gap:14px;align-items:start;padding:12px;background:var(--panel-2);border-radius:var(--radius)}
.ccard img{width:132px;height:auto;border-radius:2px;display:block}
.ccard h4{margin:0;font-family:var(--font-display);font-weight:400;font-size:26px;line-height:1}
.ccard p{margin-top:6px;color:var(--ink-2)}
.ccard .by{font-size:13px;color:var(--ink-3)}
@media (max-width:440px){.ccard{grid-template-columns:minmax(0,1fr)}}
.rules section + section{margin-top:4px}
.rules p{color:var(--ink-2);max-width:66ch}
.rules p + p{margin-top:6px}
.rules ul.plain{display:flex;flex-direction:column;gap:4px;color:var(--ink-2)}
.rules ul.plain b{color:var(--ink)}
.costs td img{width:28px;height:28px;object-fit:contain;vertical-align:middle;margin-right:8px}
.costs td img.crops{object-fit:cover;border-radius:var(--radius)}

/* game over */
.over{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:24px;align-items:start}
.over .win{font-family:var(--font-display);font-weight:400;font-size:clamp(44px,8vw,84px);line-height:.95;color:var(--frame);text-wrap:balance}
.over .why{margin-top:10px;font-size:17px;color:var(--ink-2)}
.over h2{margin:24px 0 8px}
@media (max-width:760px){.over{grid-template-columns:minmax(0,1fr)}}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Conquer polish layer. Everything is gated by html.p-on, which polish.js sets only
   when motion is allowed and window.__fast is not true. Transforms and opacity only.
   Durations used: 120ms, 180ms, 220ms. */

html.p-on .opt{transition:border-color .12s,background-color .12s,transform .12s}

/* claimed: the owner wash blooms outward from the cell centre */
html.p-on .cell.p-claim::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;background:color-mix(in srgb,var(--k) 52%,transparent);transform-origin:50% 50%;animation:p-claim .22s ease-out both}
@keyframes p-claim{from{transform:scale(.4);opacity:.9}to{transform:scale(1);opacity:0}}

/* captured: the new owner's edge flashes once */
html.p-on .cell.p-capture::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;box-shadow:inset 0 0 0 4px var(--k);animation:p-capture .22s ease-out both}
@keyframes p-capture{from{opacity:1}to{opacity:0}}

/* built: the asset drops in 6px and settles */
html.p-on .cell.p-build .asset{animation:p-build .18s cubic-bezier(.2,.8,.3,1) both}
@keyframes p-build{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}

/* legal-move rings fade in, only on cells that just became legal */
html.p-on .cell.p-ring::after{animation:p-fade .18s ease-out both}
@keyframes p-fade{from{opacity:0}to{opacity:1}}

/* modals rise 8px and fade */
html.p-on .scrim.p-modal{animation:p-fade .12s ease-out both}
html.p-on .scrim.p-modal .dialog{animation:p-rise .18s ease-out both}
@keyframes p-rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* dice tumble: rotate in, then the pips reveal. --pd is the stagger delay set by polish.js */
html.p-on .die.p-roll{transform-origin:50% 50%;animation:p-tumble .22s ease-out var(--pd,0ms) both}
@keyframes p-tumble{from{transform:rotate(-120deg) scale(.8);opacity:0}to{transform:none;opacity:1}}
html.p-on .die.p-roll .dp{animation:p-fade .12s ease-out calc(var(--pd,0ms) + 100ms) both}

/* gold changed: the number ticks in from above */
html.p-on td.p-tick{animation:p-tick .18s ease-out both}
@keyframes p-tick{from{transform:translateY(-5px);opacity:.3}to{transform:none;opacity:1}}

</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
'use strict';
/* ============================== DATA ============================== */
const N = 11;
const HALF = 61;
const SAVE_KEY = 'conquer.save.v2';
const DIRS = [[-1,0],[1,0],[0,-1],[0,1]];
const KINGDOMS = {
  red:    {name:'Red',    color:'#C8322B'},
  blue:   {name:'Blue',   color:'#2F5FD0'},
  mint:   {name:'Mint',   color:'#3FA584'},
  black:  {name:'Black', color:'#24272E'},
  bone:   {name:'Bone',   color:'#E8E2D0'},
};
const KINGDOM_IDS = Object.keys(KINGDOMS);
const ASSETS = {
  fort:      {name:'Fort',      cost:120, group:'structure'},
  outpost:   {name:'Outpost',   cost:40,  group:'structure'},
  crops:     {name:'Crops',     cost:20,  group:'supply'},
  livestock: {name:'Livestock', cost:20,  group:'supply'},
  well:      {name:'Well',      cost:20,  group:'supply'},
  mine:      {name:'Gold Mine', cost:30,  group:'supply'},
  armory:    {name:'Armory',    cost:30,  group:'supply'},
};
const SUPPLY_TYPES = ['crops','livestock','well','mine','armory'];
const BUILD_ORDER = ['crops','livestock','well','mine','armory','outpost','fort'];
const FEATS = {
  first_victory:{name:'First Victory', glory:3, text:'Win the first battle of the year (attacking or defending).'},
  siege:        {name:'Siege',         glory:4, text:'Win an attack on an enemy Fort.'},
  most_tiles:   {name:'Most Tiles',    glory:2, text:'Gain the most squares this year.'},
  settler:      {name:'Settler',       glory:2, text:'Build the most assets this year.'},
  defender:     {name:'Defender',      glory:2, text:'Hold your land against an attack.'},
};
const CARDS = {
  famine:    {kind:'disaster', name:'Famine',    hits:'crops',     text:'Every player loses one Crops.'},
  drought:   {kind:'disaster', name:'Drought',   hits:'well',      text:'Every player loses one Well.'},
  cave_in:   {kind:'disaster', name:'Cave-in',   hits:'mine',      text:'Every player loses one Gold Mine.'},
  plague:    {kind:'disaster', name:'Plague',    hits:'livestock', text:'Every player loses one Livestock.'},
  snowstorm: {kind:'disaster', name:'Snowstorm', hits:'outpost',   text:'Every player loses one Outpost.'},
  caravan:   {kind:'event', name:'Trade Caravan',     text:'Every player collects 20 gold.'},
  harvest:   {kind:'event', name:'Bountiful Harvest', text:'Every player collects 10 gold per Crops and Livestock.'},
  gold_rush: {kind:'event', name:'Gold Rush',         text:'Gold Mines pay 30 instead of 20 at the end of the coming year.'},
  truce:     {kind:'event', name:'Truce',             text:'No one may enter enemy land during the coming year.'},
  boon:      {kind:'event', name:"Loser's Boon",      text:'Everyone pays 20 gold to the smallest kingdom.'},
  f_first_victory:{kind:'feat', feat:'first_victory', name:'First Victory', text:'First Victory is worth double Glory (+6) in the coming year.'},
  f_siege:        {kind:'feat', feat:'siege',         name:'Siege',         text:'Siege is worth double Glory (+8) in the coming year.'},
  f_most_tiles:   {kind:'feat', feat:'most_tiles',    name:'Most Tiles',    text:'Most Tiles is worth double Glory (+4) in the coming year.'},
  f_settler:      {kind:'feat', feat:'settler',       name:'Settler',       text:'Settler is worth double Glory (+4) in the coming year.'},
  f_defender:     {kind:'feat', feat:'defender',      name:'Defender',      text:'Defender is worth double Glory (+4) in the coming year.'},
};
const AWARDS = [
  {id:'kingdom',  name:'Largest Kingdom', pts:5, what:'most squares',          val:p=>squares(p)},
  {id:'supplies', name:'Most Supplies',   pts:2, what:'most supply tiles',     val:p=>supplyCount(p)},
  {id:'conqueror',name:'Conqueror',       pts:3, what:'most battles won',      val:p=>S.players[p].battlesWon},
  {id:'richest',  name:'Richest',         pts:2, what:'most gold',             val:p=>S.players[p].gold},
  {id:'builder',  name:'Master Builder',  pts:2, what:'most Forts and Outposts', val:p=>countB(p,'fort')+countB(p,'outpost')},
  {id:'plentiful',name:'Most Plentiful',  pts:2, what:'most food tiles',       val:p=>food(p)},
];

/* ============================== HELPERS ============================== */
let S = null;
const key = (r,c) => r+','+c;
const inB = (r,c) => r>=0 && c>=0 && r<N && c<N;
const cell = (r,c) => S.board[r][c];
function rnd(n){ return Math.floor(Math.random()*n); }
function d6(){ return 1+rnd(6); }
function rollDice(n){ const a=[]; for (let i=0;i<n;i++) a.push(d6()); return a; }
const sum = a => a.reduce((x,y)=>x+y,0);
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=rnd(i+1); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
const cheb = (a,b) => Math.max(Math.abs(a.r-b.r), Math.abs(a.c-b.c));
const pcolor = p => (S.players[p] && S.players[p].kingdom) ? KINGDOMS[S.players[p].kingdom].color : '#8A9096';
const pname = p => S.players[p].name;
const art = w => (/^[aeiou]/i.test(w)?'an ':'a ')+w;
function log(msg){ S.log.push(msg); if (S.log.length>80) S.log.shift(); }

/* ============================== NEW GAME ============================== */
function newGame(cfg){
  const board = [];
  for (let r=0;r<N;r++){ const row=[]; for (let c=0;c<N;c++) row.push({o:null,b:null}); board.push(row); }
  S = {
    phase:'rolloff', board,
    players: cfg.players.map(pl => ({name:pl.name, bot:!!pl.bot, kingdom:null, gold:100, pawn:null, glory:0, battlesWon:0, roll:null, rerolls:[], shownRoll:null})),
    turn:0, year:1, deck:shuffle(Object.keys(CARDS)), discard:[], drawCount:0, drawer:0, activeCard:null,
    flags:{truce:false, goldRush:false, spotlight:null}, ys:null, log:[], setup:null, t:null,
    startedAt:null, playMs:0, yearLimit: cfg.yearLimit||0, endReason:null, winnerHalf:null,
  };
  S.ys = freshYearStats();
}
function freshYearStats(){ return {firstVictory:null, pp:S.players.map(()=>({gained:0, built:0, sieged:false, defended:false}))}; }

/* ============================== COUNTS ============================== */
function eachCell(fn){ for (let r=0;r<N;r++) for (let c=0;c<N;c++) fn(S.board[r][c], r, c); }
function squares(p){ let n=0; eachCell(x=>{ if (x.o===p) n++; }); return n; }
function countB(p,type){ let n=0; eachCell(x=>{ if (x.o===p && x.b===type) n++; }); return n; }
function supplyCount(p){ let n=0; eachCell(x=>{ if (x.o===p && x.b && ASSETS[x.b].group==='supply') n++; }); return n; }
function food(p){ return countB(p,'crops')+countB(p,'livestock'); }
function fortsOf(p){ const out=[]; eachCell((x,r,c)=>{ if (x.o===p && x.b==='fort') out.push({r,c}); }); return out; }
function allForts(){ const out=[]; eachCell((x,r,c)=>{ if (x.b==='fort') out.push({r,c,o:x.o}); }); return out; }
function troops(p){ return countB(p,'outpost') + countB(p,'fort')*(countB(p,'crops')+countB(p,'livestock')+countB(p,'well')); }
function armories(p){ return countB(p,'armory'); }
function income(p){ return 20 + countB(p,'mine')*(S.flags.goldRush?30:20); }
function ownNeighbors(p,r,c){ let n=0; for (const [dr,dc] of DIRS){ const rr=r+dr, cc=c+dc; if (inB(rr,cc) && cell(rr,cc).o===p) n++; } return n; }
function farFromForts(r,c){ return allForts().every(f => cheb(f,{r,c})>=3); }
function assetCells(p,type){ const out=[]; eachCell((x,r,c)=>{ if (x.o===p && x.b===type) out.push({r,c}); }); return out; }

/* ============================== ROLL-OFF & SETUP ============================== */
function rollOff(){
  const pl = S.players;
  pl.forEach(p => { p.roll=d6(); p.rerolls=[]; p.shownRoll=p.roll; });
  let key2 = pl.map(p=>p.roll);
  for (let guard=0; guard<30; guard++){
    const groups={}; pl.forEach((p,i)=>{ (groups[key2[i]]=groups[key2[i]]||[]).push(i); });
    const tied=Object.values(groups).filter(g=>g.length>1);
    if (!tied.length) break;
    tied.forEach(g => g.forEach(i => { const r=d6(); pl[i].rerolls.push(r); key2[i] = key2[i] + r/Math.pow(10, pl[i].rerolls.length); }));
  }
  const order = pl.map((p,i)=>i).sort((a,b)=>key2[b]-key2[a]);
  S.players = order.map(i=>pl[i]);
  S.ys = freshYearStats();
  S.setup = {i:0, step:'color'};
  log('Turn order: ' + S.players.map(p=>p.name).join(', ') + '.');
}
function takenKingdoms(){ return S.players.map(p=>p.kingdom).filter(Boolean); }
function chooseKingdom(p,kid){
  if (!KINGDOMS[kid] || takenKingdoms().includes(kid)) return false;
  S.players[p].kingdom = kid;
  if (S.setup && S.setup.i===p && S.setup.step==='color') S.setup.step='fort';
  return true;
}
function fortSpotLegal(r,c){
  if (r<1 || c<1 || r>N-2 || c>N-2) return false;
  for (let dr=-1;dr<=1;dr++) for (let dc=-1;dc<=1;dc++){ const x=cell(r+dr,c+dc); if (x.o!==null || x.b!==null) return false; }
  return farFromForts(r,c);
}
function relaxedFortSpot(r,c){ return inB(r,c) && cell(r,c).o===null && cell(r,c).b===null && farFromForts(r,c); }
function claim3x3(p,r,c){
  let n=0;
  for (let dr=-1;dr<=1;dr++) for (let dc=-1;dc<=1;dc++){ const rr=r+dr, cc=c+dc; if (inB(rr,cc) && cell(rr,cc).o===null){ cell(rr,cc).o=p; n++; } }
  return n;
}
function placeStartFort(p,r,c){
  if (!fortSpotLegal(r,c) && !(noStrictFortSpot() && relaxedFortSpot(r,c))) return false;
  claim3x3(p,r,c); cell(r,c).o=p; cell(r,c).b='fort';
  S.players[p].pawn={r,c};
  if (S.setup && S.setup.i===p && S.setup.step==='fort') S.setup.step='crops';
  return true;
}
function noStrictFortSpot(){ for (let r=0;r<N;r++) for (let c=0;c<N;c++) if (fortSpotLegal(r,c)) return false; return true; }
function startAssetLegal(p,r,c){ return inB(r,c) && cell(r,c).o===p && cell(r,c).b===null; }
function placeStartAsset(p,r,c,type){
  if (!startAssetLegal(p,r,c)) return false;
  cell(r,c).b=type;
  if (S.setup && S.setup.i===p){ if (S.setup.step==='crops' && type==='crops') S.setup.step='armory'; else if (S.setup.step==='armory' && type==='armory') S.setup.step='done'; }
  return true;
}
function botFortSpot(){
  const forts=allForts(); let strict=!noStrictFortSpot(); let best=null;
  for (let r=0;r<N;r++) for (let c=0;c<N;c++){
    if (strict ? !fortSpotLegal(r,c) : !relaxedFortSpot(r,c)) continue;
    let dmin=99; forts.forEach(f=>{ dmin=Math.min(dmin, cheb(f,{r,c})); });
    const edge=Math.min(r,c,N-1-r,N-1-c);
    // prefer spots that leave room for the remaining players: lattice 1/4/7 friendly, far from others
    const lattice = ((r-1)%3===0 && (c-1)%3===0) ? 1.2 : 0;
    const score=(forts.length?Math.min(dmin,6):0) + Math.min(edge,2)*0.4 + lattice + Math.random()*0.8;
    if (!best || score>best.score) best={r,c,score};
  }
  return best;
}
function botStartAssetSpot(p){
  const cands=[]; eachCell((x,r,c)=>{ if (startAssetLegal(p,r,c)) cands.push({r,c}); });
  return cands.length ? cands[rnd(cands.length)] : null;
}
function autoPlace(p){
  const st=S.setup, pl=S.players[p];
  if (st.step==='color'){ const free=KINGDOM_IDS.filter(k=>!takenKingdoms().includes(k)); chooseKingdom(p, free[rnd(free.length)]); }
  if (st.step==='fort'){ const s=botFortSpot(); if (s) placeStartFort(p,s.r,s.c); else st.step='crops'; }
  if (st.step==='crops'){ const s=botStartAssetSpot(p); if (s) placeStartAsset(p,s.r,s.c,'crops'); else st.step='armory'; }
  if (st.step==='armory'){ const s=botStartAssetSpot(p); if (s) placeStartAsset(p,s.r,s.c,'armory'); else st.step='done'; }
  log(pl.name+' founded the '+KINGDOMS[pl.kingdom].name+' kingdom.');
}
function setupAdvance(){
  const st=S.setup; if (!st || st.step!=='done') return;
  st.i++; st.step='color';
  if (st.i>=S.players.length) finishSetup();
}
function finishSetup(){
  S.setup=null; S.phase='play'; S.year=1; S.startedAt=Date.now(); S.playMs=0; S.ys=freshYearStats();
  checkHalf();
}

/* ============================== TURN ============================== */
function startTurn(idx, humansCount){
  S.turn=idx; const pl=S.players[idx];
  const humans = humansCount==null ? S.players.filter(p=>!p.bot).length : humansCount;
  S.t={phase:(!pl.bot && humans>1)?'pass':'roll', rolled:null, stepsLeft:0, pos:{...pl.pawn}, start:{...pl.pawn},
       visited:{[key(pl.pawn.r,pl.pawn.c)]:true}, claimed:[], path:[], captured:null, target:null, retreated:false, sacked:false};
}
function doRoll(){ const t=S.t; t.rolled=d6(); t.stepsLeft=t.rolled; t.phase='move'; if (!legalSteps().length) t.phase='stuck'; }
function legalSteps(){
  const t=S.t, p=S.turn, out=[];
  for (const [dr,dc] of DIRS){
    const r=t.pos.r+dr, c=t.pos.c+dc; if (!inB(r,c) || t.visited[key(r,c)]) continue;
    const x=cell(r,c);
    if (x.o!==null && x.o!==p){ if (S.flags.truce) continue; out.push({r,c,enemy:true}); }
    else out.push({r,c,enemy:false});
  }
  return out;
}
function doStep(r,c){
  const t=S.t, p=S.turn; if (!t || t.phase!=='move') return null;
  const ok=legalSteps().find(s=>s.r===r&&s.c===c); if (!ok) return null;
  if (ok.enemy){ t.phase='trespass'; t.target={r,c}; return 'trespass'; }
  const x=cell(r,c), claimedNow = x.o===null;
  if (claimedNow){ x.o=p; t.claimed.push({r,c}); }
  t.path.push({r,c,claimed:claimedNow}); t.visited[key(r,c)]=true; t.pos={r,c}; S.players[p].pawn={r,c}; t.stepsLeft--;
  if (t.stepsLeft===0 || !legalSteps().length){ finalizeMove(); return 'done'; }
  return 'moved';
}
function undoStep(){
  const t=S.t, p=S.turn; if (!t || t.phase!=='move' || !t.path.length) return;
  const last=t.path.pop(); delete t.visited[key(last.r,last.c)];
  if (last.claimed){ cell(last.r,last.c).o=null; t.claimed=t.claimed.filter(q=>!(q.r===last.r&&q.c===last.c)); }
  const prev=t.path.length?t.path[t.path.length-1]:t.start; t.pos={r:prev.r,c:prev.c}; S.players[p].pawn={...t.pos}; t.stepsLeft++;
}
function doRetreat(){
  const t=S.t, p=S.turn;
  t.claimed.forEach(q=>{ if (cell(q.r,q.c).o===p) cell(q.r,q.c).o=null; });
  t.claimed=[]; t.path=[]; t.pos={...t.start}; S.players[p].pawn={...t.start}; t.retreated=true; t.target=null; t.phase='end';
}
function finalizeMove(){
  const t=S.t, p=S.turn;
  S.ys.pp[p].gained += t.claimed.length + (t.captured?1:0);
  S.players[p].pawn={...t.pos};
  const x=cell(t.pos.r,t.pos.c);
  t.phase=(x.o===p && x.b===null)?'build':'end';
}
function endMoveEarly(){ if (S.t && (S.t.phase==='move'||S.t.phase==='stuck')) finalizeMove(); }

/* ============================== BATTLE ============================== */
function applyRerolls(dice,n){
  const d=dice.slice(), re=[];
  for (let k=0;k<n;k++){
    let lo=-1; for (let i=0;i<d.length;i++) if (d[i]<=3 && !re.some(x=>x.i===i) && (lo<0 || d[i]<d[lo])) lo=i;
    if (lo<0) break;
    const from=d[lo]; d[lo]=d6(); re.push({i:lo, from, to:d[lo]});
  }
  return {dice:d, re};
}
function winProb(att,def){
  // re-rolling a die of 3 or less adds about 1.25 pips on average; at most 6 useful re-rolls
  const reA=Math.min(armories(att),4)*1.25, reD=Math.min(armories(def),4)*1.25;
  const eff = troops(att)-troops(def) + reA - reD - 0.5; // ties go to the defender
  const z = eff/5.92;
  const t=1/(1+0.2316419*Math.abs(z)), dens=Math.exp(-z*z/2)/Math.sqrt(2*Math.PI);
  const poly=t*(0.319381530+t*(-0.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429))));
  const cdf = z>=0 ? 1-dens*poly : dens*poly;
  return Math.min(0.99, Math.max(0.01, cdf));
}
function featAmount(id){ return FEATS[id].glory * (S.flags.spotlight===id ? 2 : 1); }
function awardGlory(p,id,list){ const a=featAmount(id); S.players[p].glory+=a; list.push({p, feat:id, amount:a}); }
function resolveBattle(){
  const t=S.t, att=S.turn, tgt=t.target, x=cell(tgt.r,tgt.c), def=x.o, isFort=x.b==='fort';
  const rep={att, def, target:{...tgt}, isFort, building:x.b, aT:troops(att), dT:troops(def)};
  const aRaw=rollDice(6), dRaw=rollDice(6);
  const a=applyRerolls(aRaw, armories(att)), d=applyRerolls(dRaw, armories(def));
  rep.aRaw=aRaw; rep.dRaw=dRaw; rep.aDice=a.dice; rep.dDice=d.dice; rep.aRe=a.re; rep.dRe=d.re;
  rep.aS=rep.aT+sum(a.dice); rep.dS=rep.dT+sum(d.dice);
  rep.attWins = rep.aS>rep.dS; rep.margin=Math.abs(rep.aS-rep.dS);
  const winner=rep.attWins?att:def, loser=rep.attWins?def:att; rep.winner=winner; rep.loser=loser;
  rep.repDice = rollDice(rep.attWins && isFort ? 2 : 1);
  rep.owed = sum(rep.repDice)*10;
  rep.paid = Math.min(rep.owed, S.players[loser].gold);
  S.players[loser].gold -= rep.paid; S.players[winner].gold += rep.paid;
  S.players[winner].battlesWon++;
  rep.pawnSent=false;
  if (rep.attWins && !isFort){
    x.o=att; t.captured={...tgt};
    const dp=S.players[def];
    if (dp.pawn && dp.pawn.r===tgt.r && dp.pawn.c===tgt.c){ const f=fortsOf(def)[0]; if (f){ dp.pawn={r:f.r,c:f.c}; rep.pawnSent=true; } }
    t.path.push({r:tgt.r,c:tgt.c,claimed:false}); t.visited[key(tgt.r,tgt.c)]=true; t.pos={...tgt}; S.players[att].pawn={...tgt};
    t.stepsLeft=0; t.target=null; finalizeMove();
  } else if (rep.attWins && isFort){
    t.sacked=true; t.stepsLeft=0; t.target=null; finalizeMove();
  } else {
    doRetreat();
  }
  rep.glory=[];
  const ys=S.ys;
  if (ys.firstVictory===null){ ys.firstVictory=winner; awardGlory(winner,'first_victory',rep.glory); }
  if (rep.attWins && isFort && !ys.pp[att].sieged){ ys.pp[att].sieged=true; awardGlory(att,'siege',rep.glory); }
  if (!rep.attWins && !ys.pp[def].defended){ ys.pp[def].defended=true; awardGlory(def,'defender',rep.glory); }
  log(pname(att)+' attacked '+pname(def)+(isFort?"'s Fort":'')+'. '+pname(winner)+' won, '+rep.aS+' to '+rep.dS+'.');
  return rep;
}

/* ============================== BUILD ============================== */
const ASSET_DESC = {
  crops:'+1 troop per Fort', livestock:'+1 troop per Fort', well:'+1 troop per Fort',
  mine:'+20 gold each year', armory:'Re-roll one die in battle', outpost:'+1 troop', fort:'Claims its 3x3, multiplies supply troops',
};
function buildOptions(p){
  const t=S.t, pl=S.players[p], pos=t.pos, out=[];
  BUILD_ORDER.forEach(type => {
    const cost=ASSETS[type].cost; let ok=pl.gold>=cost, why=ok?'':'Needs '+cost+' gold';
    if (type==='fort'){
      if (countB(p,'fort')>=2){ ok=false; why='Two Forts already'; }
      else if (!farFromForts(pos.r,pos.c)){ ok=false; why='Too close to a Fort'; }
    }
    out.push({type, cost, ok, why, desc:ASSET_DESC[type]});
  });
  return out;
}
function doBuild(type){
  const t=S.t, p=S.turn, pl=S.players[p]; if (!t || t.phase!=='build') return false;
  const x=cell(t.pos.r,t.pos.c); if (x.o!==p || x.b!==null) return false;
  const opt=buildOptions(p).find(o=>o.type===type); if (!opt || !opt.ok) return false;
  x.b=type; pl.gold-=opt.cost; S.ys.pp[p].built++;
  if (type==='fort'){ const n=claim3x3(p,t.pos.r,t.pos.c); S.ys.pp[p].gained+=n; }
  log(pname(p)+' built '+art(ASSETS[type].name)+'.');
  t.phase='end'; return true;
}

/* ============================== END CONDITIONS ============================== */
function checkHalf(){
  if (!S || S.phase==='over') return S && S.winnerHalf!=null ? S.winnerHalf : null;
  for (let p=0;p<S.players.length;p++) if (squares(p)>=HALF){ S.winnerHalf=p; endGame('half'); return p; }
  return null;
}
function endGame(reason){ S.phase='over'; S.endReason=reason; S.t=null; log('Game over.'); }

/* ============================== YEAR END ============================== */
function drawCard(){
  if (!S.deck.length){ S.deck=shuffle(S.discard.slice()); S.discard=[]; }
  const id=S.deck.shift(); S.discard.push(id); S.drawCount++;
  const c=CARDS[id], drawer=S.drawer; S.drawer=(S.drawer+1)%S.players.length;
  S.activeCard=id; S.flags={truce:false, goldRush:false, spotlight:null};
  const rep={id, kind:c.kind, name:c.name, text:c.text, drawer, lines:[], losses:[]};
  if (c.kind==='disaster'){
    S.players.forEach((pl,i)=>{
      const cells=assetCells(i,c.hits);
      if (!cells.length){ rep.losses.push({p:i, type:null}); return; }
      const pick=cells[rnd(cells.length)]; cell(pick.r,pick.c).b=null; rep.losses.push({p:i, type:c.hits});
    });
  } else if (c.kind==='event'){
    if (id==='caravan') S.players.forEach(pl=>pl.gold+=20);
    if (id==='harvest') S.players.forEach((pl,i)=>{ const g=10*food(i); pl.gold+=g; rep.lines.push(pl.name+' collects '+g+' gold.'); });
    if (id==='gold_rush'){ S.flags.goldRush=true; rep.lines.push('Each Gold Mine pays 30 at the end of this year.'); }
    if (id==='truce'){ S.flags.truce=true; rep.lines.push('Enemy land is closed until the next card.'); }
    if (id==='boon'){
      const sq=S.players.map((pl,i)=>squares(i)); const m=Math.min(...sq);
      const small=sq.map((v,i)=>v===m?i:-1).filter(i=>i>=0);
      if (small.length===S.players.length){ rep.lines.push('Every kingdom is the same size, so no one pays.'); }
      else {
        let pot=0; S.players.forEach((pl,i)=>{ if (!small.includes(i)){ const pay=Math.min(20,pl.gold); pl.gold-=pay; pot+=pay; } });
        const share=Math.floor(pot/small.length);
        small.forEach(i=>{ S.players[i].gold+=share; rep.lines.push(pname(i)+' has the smallest kingdom and receives '+share+' gold.'); });
      }
    }
  } else if (c.kind==='feat'){
    S.flags.spotlight=c.feat;
  }
  log('Chronicle: '+c.name+'.');
  return rep;
}
function yearEnd(elapsedMs){
  if (elapsedMs!=null) S.playMs=elapsedMs;
  const rep={year:S.year, income:[], feats:[], card:null, gameOver:false, reason:null};
  S.players.forEach((pl,i)=>{ const g=income(i); pl.gold+=g; rep.income.push({p:i, g}); });
  const mt=Math.max(...S.ys.pp.map(q=>q.gained));
  if (mt>0) S.ys.pp.forEach((q,i)=>{ if (q.gained===mt) awardGlory(i,'most_tiles',rep.feats); });
  const mb=Math.max(...S.ys.pp.map(q=>q.built));
  if (mb>0) S.ys.pp.forEach((q,i)=>{ if (q.built===mb) awardGlory(i,'settler',rep.feats); });
  if (S.yearLimit && S.year >= S.yearLimit){
    rep.gameOver=true; rep.reason='years'; endGame('years');
  } else {
    rep.card=drawCard();
    S.ys=freshYearStats();
  }
  S.year++;
  return rep;
}
function computeScores(){
  const n=S.players.length, points=new Array(n).fill(0), glory=S.players.map(p=>p.glory), rows=[];
  AWARDS.forEach(a=>{
    const vals=S.players.map((p,i)=>a.val(i)); const m=Math.max(...vals);
    const winners = m>0 ? vals.map((v,i)=>v===m?i:-1).filter(i=>i>=0) : [];
    winners.forEach(i=>points[i]+=a.pts); rows.push({a, m, winners, vals});
  });
  const totals=points.map((pt,i)=>Math.round((pt+glory[i]/3)*10)/10);
  const rank=S.players.map((p,i)=>i).sort((x,y)=> (totals[y]-totals[x]) || (squares(y)-squares(x)) || (x-y));
  return {rows, points, glory, totals, rank};
}

/* ============================== BOTS ============================== */
function enumPaths(p,start,n,visited0){
  const paths=[], vis=Object.assign({},visited0); let count=0;
  function dfs(pos,path,left){
    if (count>3000) return;
    if (left===0){ paths.push({path:path.slice(), enemyEnd:false}); count++; return; }
    let any=false;
    for (const [dr,dc] of DIRS){
      const r=pos.r+dr, c=pos.c+dc; if (!inB(r,c)) continue; const k=key(r,c); if (vis[k]) continue;
      const x=cell(r,c);
      if (x.o!==null && x.o!==p){ if (!S.flags.truce){ paths.push({path:path.concat([{r,c}]), enemyEnd:true}); count++; any=true; } continue; }
      any=true; vis[k]=true; path.push({r,c}); dfs({r,c},path,left-1); path.pop(); delete vis[k];
    }
    if (!any && path.length){ paths.push({path:path.slice(), enemyEnd:false}); count++; }
  }
  dfs(start,[],n); return paths;
}
function evalPath(p,pp){
  const walk=pp.enemyEnd?pp.path.slice(0,-1):pp.path;
  let claims=0, adj=0;
  walk.forEach(q=>{ if (cell(q.r,q.c).o===null){ claims++; if (ownNeighbors(p,q.r,q.c)>0) adj+=0.1; } });
  let v=claims+adj+Math.random()*0.3;
  if (pp.enemyEnd){
    const tgt=pp.path[pp.path.length-1], x=cell(tgt.r,tgt.c), def=x.o, pw=winProb(p,def), isFort=x.b==='fort';
    const glory = (S.ys.firstVictory===null ? featAmount('first_victory')/3 : 0) + (isFort && !S.ys.pp[p].sieged ? featAmount('siege')/3 : 0);
    const gain = (isFort ? 2.4 : 1.4 + (x.b ? (x.b==='fort'?0:1.8) : 0)) + glory + 0.6;
    const loss = claims + 1.2;
    let open=0; eachCell(y=>{ if (y.o===null) open++; });
    const hungry = open < 12 ? 1.5 : 0; // little open land left: war is the only way to grow
    const ev = pw*(gain+hungry) - (1-pw)*loss;
    if (pw>=(hungry?0.38:0.45) && ev>0) return {v:claims+adj+ev, fight:true};
    return {v:-1, fight:false};
  }
  const end=walk[walk.length-1];
  if (end && cell(end.r,end.c).b===null && S.players[p].gold>=20) v+=0.7;
  return {v, fight:false};
}
function planBotPath(p){
  const t=S.t; const paths=enumPaths(p,t.pos,t.stepsLeft,t.visited);
  if (!paths.length) return null;
  let best=null;
  paths.forEach(pp=>{ const e=evalPath(p,pp); if (!best || e.v>best.v) best={v:e.v, fight:e.fight, path:pp.path, enemyEnd:pp.enemyEnd}; });
  return best;
}
function botFightDecision(p){ const x=cell(S.t.target.r,S.t.target.c); return winProb(p,x.o)>=0.55; }
function botChooseBuild(p){
  const opts=buildOptions(p).filter(o=>o.ok); if (!opts.length) return null;
  const pl=S.players[p], forts=countB(p,'fort'); let best=null;
  opts.forEach(o=>{
    let s=0; const n=countB(p,o.type);
    if (o.type==='fort') s = (S.year>=3 && pl.gold>=140) ? 3.2 : 0.2;
    else if (o.type==='outpost') s = 1.0 + (pl.gold>=120?0.6:0);
    else if (o.type==='crops'||o.type==='livestock'||o.type==='well') s = 1.6 + 0.5*forts - 0.05*n;
    else if (o.type==='armory') s = n<2 ? 1.7 : 0.6;
    else if (o.type==='mine') s = 2.0 - 0.25*n;
    s += Math.random()*0.5;
    if (!best || s>best.s) best={s, type:o.type};
  });
  return best.type;
}

</script>
<script>
(function(){
'use strict';
/* ============================== UI STATE ============================== */
const app = document.getElementById('app');
const modalRoot = document.getElementById('modal-root');
const LINE_ART = {fort:1, outpost:1, armory:1};
const PIECES = ['fort','outpost','crops','livestock','well','mine','armory'];
const EFFECT = {
  fort: 'Turns food and water into troops. Two at most.',
  outpost: '+1 troop in battle',
  crops: 'Food: +1 troop per Fort',
  livestock: 'Food: +1 troop per Fort',
  well: 'Water: +1 troop per Fort',
  mine: '+20 gold every year end',
  armory: 'Re-roll one low battle die',
};
const ui = {
  busy:false, running:false, modalOpen:false, lastTick:performance.now(),
  cfg:{players:[{name:'You',bot:false},{name:'Bot 1',bot:true},{name:'Bot 2',bot:true},{name:'Bot 3',bot:true}], yearLimit:15},
};
const fast = () => !!window.__fast;
const wait = ms => new Promise(r => setTimeout(r, fast() ? Math.min(ms,4) : ms));
const E = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const humans = () => S.players.filter(p => !p.bot).length;
const kname = p => { const k = S.players[p].kingdom; return k && KINGDOMS[k] ? KINGDOMS[k].name : ''; };
const aname = t => ASSETS[t] ? ASSETS[t].name : t;
const an = w => (/^[aeiou]/i.test(w) ? 'an ' : 'a ') + w;
const plural = (n, w) => n + ' ' + w + (n===1 ? '' : 's');

const coin = n => '<span class="cost"><img src="'+ART.coin10+'" alt="">'+n+'<span class="sr"> gold</span></span>';
function cost(t){ return t==='fort' ? COST_OF('fort') : COST_OF(t); }
function COST_OF(t){ return ASSETS[t] && ASSETS[t].cost!=null ? ASSETS[t].cost : 0; }

const PIPS = {1:[[50,50]],2:[[28,28],[72,72]],3:[[28,28],[50,50],[72,72]],4:[[28,28],[72,28],[28,72],[72,72]],5:[[28,28],[72,28],[50,50],[28,72],[72,72]],6:[[28,26],[72,26],[28,50],[72,50],[28,74],[72,74]]};
function die(n, o){
  o = o || {}; n = Math.max(1, Math.min(6, n|0));
  const label = o.title || ('Die showing '+n);
  return '<svg class="die'+(o.re?' re':'')+(o.big?' big':'')+'" viewBox="0 0 100 100" role="img" aria-label="'+E(label)+'"><title>'+E(label)+'</title><rect x="4" y="4" width="92" height="92" rx="14" class="df"/>'+PIPS[n].map(([x,y])=>'<circle cx="'+x+'" cy="'+y+'" r="9" class="dp"/>').join('')+'</svg>';
}

/* ============================== BOARD ============================== */
function boardHtml(hl){
  hl = hl || {};
  const pawnAt = {};
  S.players.forEach((pl,i) => { if (pl.pawn) pawnAt[key(pl.pawn.r,pl.pawn.c)] = i; });
  const t = S.t, inMove = S.phase==='play' && t && t.phase!=='pass' && t.visited;
  let h = '<div class="board" role="group" aria-label="Board, 11 by 11">';
  for (let r=0; r<N; r++) for (let c=0; c<N; c++){
    const x = cell(r,c), k = key(r,c);
    let cls = 'cell', st = '';
    if (x.o!==null && x.o!==undefined){
      cls += ' own'; st += '--k:'+pcolor(x.o)+';';
      const diff = (rr,cc) => !inB(rr,cc) || cell(rr,cc).o!==x.o;
      const sh = [];
      if (diff(r-1,c)) sh.push('inset 0 3px 0 0 var(--k)');
      if (diff(r+1,c)) sh.push('inset 0 -3px 0 0 var(--k)');
      if (diff(r,c-1)) sh.push('inset 3px 0 0 0 var(--k)');
      if (diff(r,c+1)) sh.push('inset -3px 0 0 0 var(--k)');
      if (sh.length) st += 'box-shadow:'+sh.join(',')+';';
    }
    const mark = hl[k];
    if (mark) cls += ' '+mark;
    if (S.phase==='play' && t && t.phase==='trespass' && t.target && t.target.r===r && t.target.c===c) cls += ' target';
    let label = 'Row '+(r+1)+', column '+(c+1)+', ';
    label += (x.o!==null && x.o!==undefined) ? (kname(x.o) || pname(x.o)) : 'open';
    if (x.b) label += ' '+aname(x.b);
    const pi = pawnAt[k];
    if (pi!==undefined) label += ', '+pname(pi)+"'s army";
    if (mark==='legal enemy') label += ', enemy land';
    let inner = '';
    if (x.b && ART[x.b]) inner += '<img class="asset'+(LINE_ART[x.b]?' la':'')+' '+x.b+'" src="'+ART[x.b]+'" alt="">';
    if (inMove && t.visited[k] && !(t.start && t.start.r===r && t.start.c===c)) inner += '<span class="vmark"></span>';
    if (pi!==undefined) inner += '<span class="pawn'+(S.phase==='play' && pi===S.turn ? ' cur' : '')+'" style="--pk:'+pcolor(pi)+'"></span>';
    if (mark) h += '<button type="button" class="'+cls+'" style="'+st+'" data-cell="'+r+','+c+'" aria-label="'+E(label)+'">'+inner+'</button>';
    else h += '<div class="'+cls+'" style="'+st+'" aria-label="'+E(label)+'" role="img">'+inner+'</div>';
  }
  return h + '</div>';
}
function legendHtml(){
  return '<div class="legend" aria-hidden="true">'+PIECES.map(t => '<span>'+thumb(t)+aname(t)+'</span>').join('')+
    '<span><i class="ring"></i>Your next step</span><span><i class="ring red"></i>Enemy land</span></div>';
}

/* ============================== PANELS ============================== */
function timerText(){
  if (!S || !S.yearLimit) return '';
  const left = S.yearLimit - S.year;
  return left <= 0 ? 'Final year' : plural(left,'year')+' after this';
}
function cardChip(){
  if (!S.activeCard || !CARDS[S.activeCard]) return '';
  const c = CARDS[S.activeCard], f = S.flags || {};
  let label = 'Last card: '+c.name;
  if (f.truce) label = 'Truce this year';
  else if (f.goldRush) label = 'Gold Rush this year';
  else if (f.spotlight && FEATS[f.spotlight]) label = FEATS[f.spotlight].name+' pays double';
  return '<button type="button" class="chip" data-action="showcard"><img src="'+ART[c.kind]+'" alt="">'+E(label)+'</button>';
}
function topbar(){
  let meta = '';
  if (S.phase==='play'){
    meta += '<span>Year <strong>'+S.year+'</strong>'+(S.yearLimit?' of '+S.yearLimit:'')+'</span>';
    if (S.yearLimit) meta += '<span id="timer">'+timerText()+'</span>';
    meta += cardChip();
  }
  return '<header class="top"><div class="wm">Conquer</div><div class="meta">'+meta+'</div><div class="tools"><button type="button" class="btn quiet" data-action="rules">Rules</button><button type="button" class="btn" data-action="menu">Menu</button></div></header>';
}
function kingdomsHtml(){
  let h = '<section class="panel" aria-labelledby="kh"><h2 id="kh" class="sr">Kingdoms</h2><div class="tablewrap"><table class="ktable"><thead><tr><th scope="col">Kingdom</th><th scope="col" class="n">Gold</th><th scope="col" class="n">Troops</th><th scope="col" class="n">Squares</th><th scope="col" class="n">Glory</th></tr></thead><tbody>';
  S.players.forEach((pl,i) => {
    const sq = squares(i), cur = S.phase==='play' && i===S.turn;
    h += '<tr class="'+(cur?'cur':'')+'"'+(cur?' aria-current="true"':'')+'><th scope="row">'+who(i)+(pl.bot?'<span class="bot">bot</span>':'')+'</th><td class="n">'+pl.gold+'</td><td class="n">'+troops(i)+'</td><td class="n">'+sq+'<span class="bar" style="--k:'+pcolor(i)+'" title="'+sq+' of '+HALF+'"><i style="width:'+Math.min(100, sq/HALF*100).toFixed(1)+'%"></i></span></td><td class="n">'+pl.glory+'</td></tr>';
  });
  return h + '</tbody></table></div><p class="small muted" style="margin-top:8px">First to '+HALF+' squares ends the game.</p></section>';
}
function logHtml(n){
  const l = (S.log||[]).slice(-(n||8));
  if (!l.length) return '';
  return '<section class="panel" aria-labelledby="lh"><h2 id="lh">Chronicle</h2><ol class="log">'+l.map(x => '<li>'+E(x)+'</li>').join('')+'</ol></section>';
}
function turnPanel(){
  const t = S.t; if (!t) return '';
  const p = S.turn, pl = S.players[p];
  let h = '<section class="panel turn" aria-live="polite"><div class="turn-head">'+who(p)+'<span>'+pl.gold+' gold, '+troops(p)+' troops</span></div>';
  if (ui.busy || pl.bot){
    h += '<h2 class="disp">'+E(pl.name)+' is moving</h2>';
    if (t.rolled) h += '<div class="rolled" style="margin-top:12px">'+die(t.rolled,{big:true})+'<span>Rolled '+t.rolled+'</span></div>';
    return h + '</section>';
  }
  switch (t.phase){
    case 'pass':
      h += '<h2 class="disp">Pass to '+E(pl.name)+'</h2><div class="actions"><button type="button" class="btn primary" data-action="passok">I am '+E(pl.name)+'</button></div>'; break;
    case 'roll':
      h += '<h2 class="disp">Roll to move</h2><p class="note">You walk exactly what you roll, one square at a time.</p><div class="actions"><button type="button" class="btn primary" data-action="roll">Roll the die</button></div>'; break;
    case 'move':
      h += '<div class="rolled">'+die(t.rolled,{big:true})+'<h2 class="disp">'+plural(t.stepsLeft,'step')+' left</h2></div><p class="note">Tap a ringed square.'+((S.flags&&S.flags.truce)?' Truce: enemy land is closed this year.':' Red rings are enemy land.')+'</p><div class="actions"><button type="button" class="btn" data-action="undo"'+(t.path&&t.path.length?'':' disabled')+'>Undo step</button></div>'; break;
    case 'stuck':
      h += '<div class="rolled">'+die(t.rolled,{big:true})+'<h2 class="disp">Boxed in</h2></div><p class="note">No square next to you is open, so your move ends here.</p><div class="actions"><button type="button" class="btn primary" data-action="endmove">End move</button></div>'; break;
    case 'trespass': {
      const x = cell(t.target.r,t.target.c), d = x.o, pw = winProb(p,d);
      const ra = armories(p), rd = armories(d);
      h += '<h2 class="disp">'+E(pname(d))+"'s "+(x.b==='fort'?'Fort':x.b?E(aname(x.b)):'land')+'</h2>';
      h += '<div class="vs"><div><span class="num">'+troops(p)+'</span><span class="lab">your troops<br>'+plural(ra,'re-roll')+'</span></div><span class="mid">vs</span><div><span class="num">'+troops(d)+'</span><span class="lab">their troops<br>'+plural(rd,'re-roll')+'</span></div></div>';
      h += '<p class="odds">About '+Math.round(pw*100)+'% to win</p>';
      h += '<p class="note">'+(x.b==='fort' ? "Forts can't be captured. Win and they pay 2 dice &times; 10 gold." : 'Win and the square'+(x.b?' and its '+E(aname(x.b)):'')+' is yours.')+' Lose and this turn is undone, and you pay.</p>';
      h += '<div class="actions"><button type="button" class="btn" data-action="retreat">Retreat</button><button type="button" class="btn primary" data-action="fight">Fight</button></div>'; break;
    }
    case 'build': {
      const opts = buildOptions(p);
      h += '<h2 class="disp">Build here</h2><div class="opts">';
      opts.forEach(o => {
        h += '<button type="button" class="opt" data-action="build" data-type="'+o.type+'"'+(o.ok?'':' disabled')+'>'+thumb(o.type,'th')+'<span><span class="nm">'+E(aname(o.type))+'</span><small>'+E(o.ok ? (o.desc || EFFECT[o.type] || '') : (o.why || 'Not available'))+'</small></span>'+coin(o.cost)+'</button>';
      });
      h += '</div><div class="actions"><button type="button" class="btn quiet" data-action="skip">Build nothing</button></div>'; break;
    }
    default:
      h += '<h2 class="disp">Turn over</h2>';
  }
  return h + '</section>';
}

/* ============================== RENDER ============================== */
function focusSel(){
  const a = document.activeElement;
  if (!a || !app.contains(a) || a===app) return null;
  if (a.dataset.cell) return {sel:'[data-cell="'+a.dataset.cell+'"]', cell:true};
  if (a.id) return {sel:'#'+a.id};
  if (a.dataset.action){ let s = '[data-action="'+a.dataset.action+'"]'; ['type','i','v','k'].forEach(k => { if (a.dataset[k]!=null) s += '[data-'+k+'="'+a.dataset[k]+'"]'; }); return {sel:s}; }
  return null;
}
function render(){
  const f = focusSel();
  if (!S){ renderTitle(); }
  else if (S.phase==='rolloff') renderRolloff();
  else if (S.phase==='setup') renderSetup();
  else if (S.phase==='play') renderPlay();
  else renderOver();
  if (f){
    let el = app.querySelector(f.sel);
    if (!el && f.cell) el = app.querySelector('button.cell') || app.querySelector('.turn .btn.primary');
    if (el && !el.disabled) el.focus({preventScroll:true});
  }
  save();
}
window.render = render;
function save(){ try { if (S) localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e){} }

/* ============================== MODALS ============================== */
function showModal(html, opts){
  opts = opts || {};
  return new Promise(resolve => {
    const btns = opts.buttons || [{label: opts.label || 'Continue', primary:true, value:true}];
    const back = document.activeElement;
    modalRoot.innerHTML = '<div class="scrim"><div class="dialog'+(opts.wide?' wide':'')+'" role="dialog" aria-modal="true" aria-labelledby="dlg-h" tabindex="-1">'+html+'<div class="actions">'+btns.map((b,i) => '<button type="button" class="btn'+(b.primary?' primary':'')+'" data-mi="'+i+'"'+(b.disabled?' disabled':'')+'>'+E(b.label)+'</button>').join('')+'</div></div></div>';
    ui.modalOpen = true; app.setAttribute('inert','');
    const dlg = modalRoot.querySelector('.dialog');
    let done = false;
    const finish = v => {
      if (done) return; done = true;
      document.removeEventListener('keydown', onKey, true);
      modalRoot.innerHTML = ''; ui.modalOpen = false; app.removeAttribute('inert');
      if (back && back.isConnected && typeof back.focus==='function') back.focus({preventScroll:true});
      resolve(v);
    };
    const onKey = e => {
      if (e.key==='Escape' && opts.dismiss!==false){ e.preventDefault(); finish(opts.escValue!==undefined ? opts.escValue : true); }
      else if (e.key==='Tab'){
        const f = Array.from(dlg.querySelectorAll('button:not([disabled]),[href],input,[tabindex]:not([tabindex="-1"])'));
        if (!f.length) return;
        const first = f[0], last = f[f.length-1];
        if (e.shiftKey && (document.activeElement===first || document.activeElement===dlg)){ e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
      }
    };
    document.addEventListener('keydown', onKey, true);
    modalRoot.querySelectorAll('[data-mi]').forEach(b => { b.onclick = () => finish(btns[+b.dataset.mi].value); });
    const pf = modalRoot.querySelector('.btn.primary:not([disabled])') || dlg;
    pf.focus({preventScroll:true});
    if (opts.auto) setTimeout(() => finish(true), fast() ? 4 : opts.auto);
  });
}
function battleHtml(rep){
  const side = (p, T, dice, re, score, won, role) => {
    const ri = {}; (re||[]).forEach(x => { ri[x.i] = x; });
    return '<div class="side'+(won?' won':'')+'"><div class="side-h">'+who(p)+'<span>'+role+(won?', wins':'')+'</span></div><div class="dice">'+dice.map((d,i) => die(d, {re:!!ri[i], title: ri[i] ? 'Re-rolled from '+ri[i].from+' to '+d : 'Die showing '+d})).join('')+'</div><p class="sum"><span>'+T+' troops + '+dice.reduce((a,b)=>a+b,0)+' dice</span><b>'+score+'</b></p></div>';
  };
  let h = '<h2 id="dlg-h" class="disp">'+E(pname(rep.winner))+' wins</h2>';
  let v;
  if (rep.attWins) v = rep.isFort ? 'The Fort holds, but '+E(pname(rep.def))+' pays double.' : E(pname(rep.att))+' takes the square'+(rep.building?' and its '+E(aname(rep.building)):'')+'.';
  else v = E(pname(rep.def))+' holds. '+E(pname(rep.att))+' falls back and this turn is undone.';
  h += '<p class="sub">'+(rep.margin===0?'Tied, so the defender holds. ':'By '+rep.margin+'. ')+v+'</p>';
  h += '<div class="sides">'+side(rep.att, rep.aT, rep.aDice, rep.aRe, rep.aS, rep.attWins, 'Attacker')+side(rep.def, rep.dT, rep.dDice, rep.dRe, rep.dS, !rep.attWins, 'Defender')+'</div>';
  h += '<h3>Reparations</h3><ul class="lines"><li><span class="dice">'+(rep.repDice||[]).map(d=>die(d)).join('')+'</span><span>'+E(pname(rep.loser))+' pays <span class="val">'+rep.paid+'</span>'+(rep.paid<rep.owed?' of '+rep.owed:'')+' gold</span></li>';
  if (rep.pawnSent) h += '<li><span>'+E(pname(rep.def))+"'s army</span><span>falls back to its Fort</span></li>";
  h += '</ul>';
  if (rep.glory && rep.glory.length) h += '<h3>Glory</h3><ul class="lines">'+rep.glory.map(g => '<li>'+who(g.p)+'<span>'+E(FEATS[g.feat] ? FEATS[g.feat].name : g.feat)+' <span class="val">+'+g.amount+'</span></span></li>').join('')+'</ul>';
  return h;
}
function cardHtml(c, opts){
  opts = opts || {};
  let h = '<figure class="ccard"><img src="'+ART[c.kind]+'" alt="'+E(c.kind)+' card"><figcaption><h4>'+E(c.name)+'</h4><p>'+E(c.text)+'</p>'+(c.drawer!=null && S.players[c.drawer] ? '<p class="by">Drawn by '+E(pname(c.drawer))+'</p>' : '')+'</figcaption></figure>';
  const lines = (c.lines||[]).map(l => '<li><span>'+E(l)+'</span></li>');
  (c.losses||[]).forEach(l => { lines.push('<li>'+who(l.p)+'<span>'+(l.type ? 'loses '+E(an(aname(l.type))) : '<span class="muted">nothing to lose</span>')+'</span></li>'); });
  if (lines.length) h += '<ul class="lines" style="margin-top:10px">'+lines.join('')+'</ul>';
  return h;
}
function yearHtml(rep){
  let h = '<h2 id="dlg-h" class="disp">Year '+rep.year+' ends</h2>';
  h += '<h3>Income</h3><ul class="lines">'+rep.income.map(x => '<li>'+who(x.p)+'<span><span class="val">+'+x.g+'</span> gold, '+S.players[x.p].gold+' on hand</span></li>').join('')+'</ul>';
  h += '<h3>Feats</h3>'+(rep.feats && rep.feats.length ? '<ul class="lines">'+rep.feats.map(f => '<li>'+who(f.p)+'<span>'+E(FEATS[f.feat] ? FEATS[f.feat].name : f.feat)+' <span class="val">+'+f.amount+'</span> Glory</span></li>').join('')+'</ul>' : '<p class="muted">Nobody scored a year-end feat.</p>');
  if (rep.card){ h += '<h3>Chronicle card</h3>'+cardHtml(rep.card); }
  if (rep.gameOver) h += '<p class="sub" style="margin-top:16px">'+(rep.reason==='years' ? 'That was the final year. Final scores are next.' : 'The game is over. Final scores are next.')+'</p>';
  return h;
}
function rulesHtml(){
  const byKind = k => Object.keys(CARDS).filter(id => CARDS[id].kind===k).map(id => '<li><b>'+E(CARDS[id].name)+'</b>: '+E(CARDS[id].text)+'</li>').join('');
  let h = '<h2 id="dlg-h" class="disp">Rules</h2><div class="rules">';
  h += '<section><h3>Setup</h3><p>Everyone starts with 100 gold and rolls one die; highest goes first. In that order, pick a kingdom color and place your free Fort. It claims the 3 by 3 around it and must sit at least 3 squares from every other Fort. Then place 1 Crops and 1 Armory on your own land.</p></section>';
  h += '<section><h3>Your turn</h3><p>Roll one die and walk exactly that many squares: up, down, left or right, never back over a square this move. Every open square you enter becomes yours.</p><p>Step onto enemy land and you stop. Retreat undoes the whole turn. Fight goes to battle. When the move ends on your own empty square you may build one asset there.</p></section>';
  h += '<section><h3>Battle</h3><p>Troops = Outposts + Forts &times; (Crops + Livestock + Wells). Each side rolls 6 dice and adds its troops. Each Armory re-rolls one low die. Higher score wins; a tie goes to the defender.</p><p>A winning attacker takes the square and anything on it. Forts can\'t be captured. The loser pays 1 die &times; 10 gold, or 2 dice &times; 10 when a Fort was attacked and its owner lost.</p></section>';
  h += '<section><h3>Costs</h3><div class="tablewrap"><table class="ktable costs"><thead><tr><th scope="col">Asset</th><th scope="col">Does</th><th scope="col" class="n">Gold</th></tr></thead><tbody>'+PIECES.map(t => '<tr><td>'+thumb(t)+E(aname(t))+'</td><td>'+E(EFFECT[t])+'</td><td class="n">'+COST_OF(t)+'</td></tr>').join('')+'</tbody></table></div></section>';
  h += '<section><h3>Year end</h3><p>After everyone has moved: +20 gold each, +20 per Gold Mine, feats are scored, then the next player in turn order draws a Chronicle card.</p></section>';
  h += '<section><h3>Disasters</h3><ul class="plain">'+byKind('disaster')+'</ul><h3>Events</h3><ul class="plain">'+byKind('event')+'</ul></section>';
  h += '<section><h3>Feats</h3><p>All five pay Glory every year.</p><ul class="plain" style="margin-top:6px">'+Object.keys(FEATS).map(id => '<li><b>'+E(FEATS[id].name)+' +'+FEATS[id].glory+'</b>: '+E(FEATS[id].text)+'</li>').join('')+'</ul></section>';
  h += '<section><h3>End and score</h3><p>The game ends when someone holds '+HALF+' squares, when the last year of the chosen game length ends, or when you end it from the menu.</p><ul class="plain" style="margin-top:6px">'+AWARDS.map(a => '<li><b>'+E(a.name)+' '+a.pts+'</b>: '+E(a.what)+'</li>').join('')+'</ul><p style="margin-top:6px">Score = award points + Glory &divide; 3. Ties go to the kingdom with more squares.</p></section>';
  h += '<section><h3>Two house readings</h3><p>The rulesheet leaves these open, so this version decides them: a second Fort also claims the open squares in its 3 by 3, and drawing a Feat card makes that feat pay double Glory the following year.</p></section>';
  return h + '</div>';
}

/* ============================== FLOWS ============================== */
async function runBotSetup(){
  if (ui.running) return;
  ui.running = true; ui.busy = true;
  try {
    while (S && S.phase==='setup' && S.setup && S.players[S.setup.i].bot){
      render(); await wait(320);
      const i = S.setup.i;
      autoPlace(i);
      if (S.phase==='setup' && S.setup && S.setup.i===i && S.setup.step==='done') setupAdvance();
      render(); await wait(240);
    }
  } finally { ui.running = false; ui.busy = false; }
  if (S && S.phase!=='setup') await beginPlay(); else render();
}
async function afterHumanSetupStep(){
  const i = S.setup.i;
  if (S.setup.step==='done'){ setupAdvance(); }
  render();
  if (S.phase==='setup' && S.setup && S.setup.i!==i) await runBotSetup();
  else if (S.phase!=='setup') await beginPlay();
}
async function beginPlay(){
  if (!S) return;
  if (S.phase==='over'){ render(); return; }
  if (checkHalf()!=null){ render(); return; }
  S.phase = 'play';
  if (!S.t) startTurn(S.turn||0, humans());
  render();
  await runUntilHuman();
}
async function nextTurn(){
  if (!S || S.phase!=='play'){ render(); return; }
  if (checkHalf()!=null){ render(); return; }
  const n = S.players.length, next = (S.turn+1) % n;
  if (next===0){
    const rep = yearEnd(S.playMs||0);
    render();
    await showModal(yearHtml(rep), {label: rep.gameOver ? 'See the scores' : 'Next year', wide:true, auto: humans()===0 ? 3000 : 0});
    if (rep.gameOver || S.phase==='over'){ if (S.phase!=='over') endGame(rep.reason || 'years'); S.phase = 'over'; render(); return; }
  }
  startTurn(next, humans());
  render();
}
async function runUntilHuman(){
  if (ui.running) return;
  ui.running = true; ui.busy = true;
  try {
    while (S && S.phase==='play' && S.t && S.players[S.turn].bot){
      render();
      await botTurn();
      if (!S || S.phase!=='play') break;
      await nextTurn();
    }
  } finally { ui.running = false; ui.busy = false; }
  if (S) render();
}
async function botTurn(){
  const p = S.turn, pl = S.players[p];
  if (S.t.phase==='pass') S.t.phase = 'roll';
  await wait(360); doRoll(); render(); await wait(420);
  let fought = false, retreated = false;
  if (S.t.phase==='stuck'){ endMoveEarly(); log(pl.name+' rolled '+S.t.rolled+' but was boxed in.'); }
  else {
    const plan = planBotPath(p);
    if (plan && plan.path){
      for (const sq of plan.path){
        const res = doStep(sq.r, sq.c); render(); await wait(150);
        if (res==='trespass'){
          const defender = cell(sq.r,sq.c).o;
          if (plan.fight || botFightDecision(p)){
            fought = true;
            const rep = resolveBattle(); render();
            const humanSide = !S.players[rep.att].bot || !S.players[rep.def].bot;
            await showModal(battleHtml(rep), humanSide ? {label:'Continue', wide:true} : {auto:2200, wide:true});
            render();
          } else {
            doRetreat(); retreated = true;
            log(pl.name+' rolled '+S.t.rolled+', reached '+pname(defender)+"'s border and retreated.");
            render();
          }
          break;
        }
        if (res!=='moved') break;
      }
    }
    if (S.t.phase==='move') endMoveEarly();
    if (S.t.phase==='trespass'){ doRetreat(); retreated = true; }
    if (!fought && !retreated) log(pl.name+' rolled '+S.t.rolled+' and claimed '+plural(S.t.claimed ? S.t.claimed.length : 0,'square')+'.');
  }
  if (checkHalf()!=null) return;
  if (S.t.phase==='build'){
    const tp = botChooseBuild(p);
    if (tp) doBuild(tp);
    S.t.phase = 'end';
    render(); await wait(320);
  }
  S.t.phase = 'end';
}
async function afterHumanMove(){
  const t = S.t, p = S.turn;
  log(pname(p)+' rolled '+t.rolled+' and claimed '+plural(t.claimed ? t.claimed.length : 0,'square')+'.');
  if (checkHalf()!=null){ render(); return; }
  if (S.t.phase==='build'){ render(); return; }
  await endHumanTurn();
}
async function endHumanTurn(){
  S.t.phase = 'end';
  await nextTurn();
  await runUntilHuman();
}
async function humanFight(){
  const rep = resolveBattle(); render();
  await showModal(battleHtml(rep), {label:'Continue', wide:true});
  if (checkHalf()!=null){ render(); return; }
  render();
  if (S.t.phase==='build') return;
  await endHumanTurn();
}
async function resumeFlows(){
  ui.busy = false; ui.running = false;
  render();
  if (S.phase==='setup') await runBotSetup();
  else if (S.phase==='play'){
    if (!S.t){ startTurn(S.turn||0, humans()); render(); }
    if (S.players[S.turn].bot){ startTurn(S.turn, humans()); render(); await runUntilHuman(); }
    else if (S.t.phase==='end') await endHumanTurn();
  }
}
async function openMenu(){
  const inGame = S && S.phase!=='over';
  const v = await showModal('<h2 id="dlg-h" class="disp">Menu</h2>'+(ui.busy?'<p class="sub">The bots are mid-turn. Ending or quitting opens up once they finish.</p>':''), {buttons:[
    {label:'Resume', primary:true, value:'resume'},
    {label:'End and score', value:'end', disabled: ui.busy || !inGame || S.phase!=='play'},
    {label:'New game', value:'new', disabled: ui.busy},
  ], escValue:'resume'});
  if (v==='end'){
    const ok = await showModal('<h2 id="dlg-h" class="disp">End the game now?</h2><p class="sub">Awards are counted from the board as it stands.</p>', {buttons:[{label:'Keep playing', value:false},{label:'End and score', primary:true, value:true}], escValue:false});
    if (ok){ endGame('players'); S.phase = 'over'; S.endReason = S.endReason || 'players'; render(); }
  } else if (v==='new'){
    const ok = inGame ? await showModal('<h2 id="dlg-h" class="disp">Quit this game?</h2><p class="sub">The saved game is cleared.</p>', {buttons:[{label:'Keep playing', value:false},{label:'Quit', primary:true, value:true}], escValue:false}) : true;
    if (ok){ S = null; try { localStorage.removeItem(SAVE_KEY); } catch(e){} render(); }
  }
}

/* ============================== INPUT ============================== */
app.addEventListener('input', e => {
  const i = e.target.dataset ? e.target.dataset.seat : null;
  if (i!=null) ui.cfg.players[+i].name = e.target.value;
});
app.addEventListener('click', async e => {
  const cl = e.target.closest('[data-cell]');
  if (cl){ if (ui.busy || ui.modalOpen || !S) return; const [r,c] = cl.dataset.cell.split(',').map(Number); await onCell(r,c); return; }
  const b = e.target.closest('[data-action]');
  if (!b || b.disabled) return;
  await onAction(b.dataset.action, b);
});
async function onAction(a, b){
  const cfg = ui.cfg;
  switch (a){
    case 'sethuman': cfg.players[+b.dataset.i].bot = false; render(); return;
    case 'setbot': cfg.players[+b.dataset.i].bot = true; render(); return;
    case 'addseat': if (cfg.players.length<5){ cfg.players.push({name:'Bot '+cfg.players.length, bot:true}); render(); } return;
    case 'removeseat': if (cfg.players.length>2){ cfg.players.pop(); render(); } return;
    case 'years': cfg.yearLimit = +b.dataset.v; render(); return;
    case 'start':
      cfg.players.forEach((p,i) => { p.name = (p.name||'').trim() || ('Player '+(i+1)); });
      newGame({players: cfg.players.map(p => ({name:p.name, bot:p.bot})), yearLimit: cfg.yearLimit});
      S.playMs = S.playMs || 0;
      render(); return;
    case 'resume': {
      let s = null; try { s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch(err){ s = null; }
      if (!s || !s.players){ render(); return; }
      S = s; await resumeFlows(); return;
    }
    case 'rules': await showModal(rulesHtml(), {label:'Back to the game', wide:true}); return;
    case 'menu': await openMenu(); return;
    case 'showcard': {
      const c = CARDS[S.activeCard]; if (!c) return;
      await showModal('<h2 id="dlg-h" class="disp">This year</h2>'+cardHtml({kind:c.kind, name:c.name, text:c.text}), {label:'Back'}); return;
    }
    case 'newgame': S = null; try { localStorage.removeItem(SAVE_KEY); } catch(e){} render(); return;
  }
  if (ui.busy || !S) return;
  switch (a){
    case 'rolloff': rollOff(); render(); return;
    case 'orderok': S.phase = 'setup'; if (!S.setup) S.setup = {i:0, step:'color'}; render(); await runBotSetup(); return;
    case 'pickcolor': {
      const p = S.setup.i; chooseKingdom(p, b.dataset.k);
      if (S.setup.step==='color') S.setup.step = 'fort';
      render(); return;
    }
    case 'autoplace': {
      const i = S.setup.i; autoPlace(i);
      if (S.phase==='setup' && S.setup && S.setup.i===i) S.setup.step = 'done';
      await afterHumanSetupStep(); return;
    }
    case 'passok': S.t.phase = 'roll'; render(); return;
    case 'roll': doRoll(); render(); return;
    case 'undo': undoStep(); render(); return;
    case 'endmove': endMoveEarly(); render(); await afterHumanMove(); return;
    case 'retreat': doRetreat(); log(pname(S.turn)+' retreated.'); render(); await endHumanTurn(); return;
    case 'fight': await humanFight(); return;
    case 'build': doBuild(b.dataset.type); render(); await endHumanTurn(); return;
    case 'skip': S.t.phase = 'end'; log(pname(S.turn)+' built nothing.'); render(); await endHumanTurn(); return;
  }
}
async function onCell(r,c){
  if (S.phase==='setup'){
    const st = S.setup, p = st.i;
    if (S.players[p].bot) return;
    if (st.step==='fort' && fortSpotLegal(r,c)){
      placeStartFort(p,r,c);
      if (S.setup.step==='fort') S.setup.step = 'crops';
      render(); return;
    }
    if ((st.step==='crops' || st.step==='armory') && startAssetLegal(p,r,c)){
      const type = st.step;
      placeStartAsset(p,r,c,type);
      if (S.setup.step===type) S.setup.step = type==='crops' ? 'armory' : 'done';
      await afterHumanSetupStep(); return;
    }
    return;
  }
  if (S.phase==='play' && S.t && S.t.phase==='move' && !S.players[S.turn].bot){
    const res = doStep(r,c);
    if (!res) return;
    render();
    if (res==='done') await afterHumanMove();
  }
}

/* ============================== CLOCK + BOOT ============================== */
setInterval(() => {
  const now = performance.now(), dt = now - ui.lastTick; ui.lastTick = now;
  if (S && S.phase==='play' && !document.hidden && dt < 5000){
    S.playMs = (S.playMs||0) + dt;
  }
}, 1000);
document.addEventListener('visibilitychange', () => { ui.lastTick = performance.now(); });

function start(data){
  document.documentElement.style.setProperty('--grass', 'url("'+ART.grass+'")');
  if (data && data.phase && data.players){ S = data; resumeFlows(); }
  else render();
}
try { if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot==='function') window.claude.hot.snapshot(() => S); } catch(e){}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready==='function') hot.ready(start);
else start(hot && hot.data ? hot.data : {});
})();

/* Conquer polish layer: one-shot animation classes after real state changes only. */
(function () {
  'use strict';
  try {
    if (window.ConquerPolish) return;
    var NS = window.ConquerPolish = { enabled: false };
    var mq = null;
    try { mq = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)'); } catch (e) {}
    if (mq && mq.matches) return;

    var root = document.documentElement;
    var prev = null;          // { owner:[], asset:[], legal:{} }
    var prevGold = null;
    var prevDice = '';

    function active() {
      var on = !window.__fast && !(mq && mq.matches);
      NS.enabled = on;
      try { root.classList.toggle('p-on', on); } catch (e) {}
      return on;
    }
    function once(el, cls, ms) {
      el.classList.add(cls);
      setTimeout(function () { try { el.classList.remove(cls); } catch (e) {} }, ms || 600);
    }
    function snapshot() {
      var cells = document.querySelectorAll('#app .board .cell');
      if (cells.length < 4) return null;
      var s = { n: cells.length, owner: [], asset: [], legal: {}, cells: cells };
      for (var i = 0; i < cells.length; i++) {
        var el = cells[i], o = null, a = '';
        if (el.classList.contains('own')) o = (el.style.getPropertyValue('--k') || '').trim() || null;
        var img = el.querySelector('.asset');
        if (img) a = String(img.className).replace(/\b(asset|la)\b/g, '').trim();
        s.owner.push(o); s.asset.push(a);
        if (el.classList.contains('legal')) s.legal[i] = true;
      }
      return s;
    }
    function board(on) {
      var cur = snapshot();
      if (on && cur && prev && prev.n === cur.n) {
        for (var i = 0; i < cur.n; i++) {
          var el = cur.cells[i];
          if (cur.owner[i] !== prev.owner[i] && cur.owner[i]) {
            once(el, prev.owner[i] ? 'p-capture' : 'p-claim', 400);
          }
          if (cur.asset[i] && cur.asset[i] !== prev.asset[i]) once(el, 'p-build', 400);
          if (cur.legal[i] && !prev.legal[i]) once(el, 'p-ring', 400);
        }
      }
      prev = cur;
    }
    function gold(on) {
      var rows = document.querySelectorAll('#app .ktable tbody tr');
      if (!rows.length) { prevGold = null; return; }
      var cur = [], cells = [];
      for (var i = 0; i < rows.length; i++) {
        var td = rows[i].querySelector('td.n');
        cells.push(td); cur.push(td ? td.textContent : '');
      }
      if (on && prevGold && prevGold.length === cur.length) {
        for (var j = 0; j < cur.length; j++) {
          if (cells[j] && cur[j] !== prevGold[j]) once(cells[j], 'p-tick', 400);
        }
      }
      prevGold = cur;
    }
    function tumble(dice, on) {
      if (!on || !dice.length) return;
      var d = 0, i, el;
      for (i = 0; i < dice.length; i++) {         // normal dice first
        el = dice[i];
        if (el.classList.contains('re')) continue;
        el.style.setProperty('--pd', Math.min(d, 240) + 'ms'); d += 40;
        once(el, 'p-roll', 800);
      }
      for (i = 0; i < dice.length; i++) {         // re-rolled dice reveal last
        el = dice[i];
        if (!el.classList.contains('re')) continue;
        el.style.setProperty('--pd', Math.min(d, 280) + 'ms'); d += 40;
        once(el, 'p-roll', 800);
      }
    }
    function turnDice(on) {
      var dice = document.querySelectorAll('#app .rolled .die');
      var sig = '';
      for (var i = 0; i < dice.length; i++) sig += (dice[i].getAttribute('aria-label') || '') + '|';
      if (sig !== prevDice && sig) tumble(dice, on);
      prevDice = sig;
    }
    function onApp() {
      try { var on = active(); board(on); gold(on); turnDice(on); } catch (e) {}
    }

    var modalWas = false;
    function onModal() {
      try {
        var on = active();
        var mr = document.getElementById('modal-root');
        var scrim = mr && mr.querySelector('.scrim');
        if (scrim && !modalWas && on) {
          once(scrim, 'p-modal', 400);
          tumble(scrim.querySelectorAll('.die'), on);
        }
        modalWas = !!scrim;
      } catch (e) {}
    }

    function start() {
      try {
        active();
        var app = document.getElementById('app'), mr = document.getElementById('modal-root');
        if (typeof MutationObserver !== 'function') return;
        if (app) { new MutationObserver(onApp).observe(app, { childList: true }); onApp(); }
        if (mr) { new MutationObserver(onModal).observe(mr, { childList: true }); onModal(); }
        if (mq && mq.addEventListener) mq.addEventListener('change', active);
      } catch (e) {}
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
    else start();
  } catch (e) {}
})();
